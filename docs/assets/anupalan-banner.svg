    <text x="970" y="23" fill="#22D3EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🔒 DPDP Act 2023</text>
  </g>

  <!-- 3 Perfectly Balanced Feature Cards (No Text Overlap) -->
  <!-- Card 1 -->
  <g transform="translate(80, 355)">
    <rect width="350" height="150" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="36" cy="36" r="14" fill="#065F46"/>
