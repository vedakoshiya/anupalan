<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Decorative Circuit / Mesh Lines -->
  <path d="M -50,100 Q 300,50 600,150 T 1250,80" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.15" fill="none"/>
  <path d="M -50,220 Q 400,280 800,180 T 1250,300" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.15" fill="none"/>
  <circle cx="1050" cy="90" r="140" fill="#3b82f6" opacity="0.06"/>
  <circle cx="150" cy="350" r="180" fill="#8b5cf6" opacity="0.05"/>

  <!-- Badge Top -->
  <g transform="translate(60, 48)">
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="16" r="6" fill="#10b981"/>
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">OPEN-SOURCE INDIC COMPLIANCE AI</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
      Anupalan <tspan fill="url(#goldGrad)" font-size="44" font-weight="700">(અનુપાલન / अनुपालन)</tspan>
    </text>
    <text x="0" y="44" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
      Zero-Hallucination Multilingual Statutory Compliance Navigator for Indian MSMEs
    </text>
  </g>

  <!-- Feature Tags Row -->
  <g transform="translate(60, 225)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⚖️ GST &amp; CBIC</text>

    <!-- Pill 2 -->
    <rect x="157" y="0" width="185" height="34" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="171" y="22" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⏱️ Section 43B(h)</text>

    <!-- Pill 3 -->
    <rect x="354" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="368" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🏭 Gujarat MSME</text>

    <!-- Pill 4 -->
    <rect x="531" y="0" width="220" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <text x="545" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🔒 DPDP Act 2023 Native</text>

    <!-- Pill 5 -->
    <rect x="763" y="0" width="175" height="34" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="777" y="22" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🌐 Gujlish / Gu / Hi / En</text>
  </g>

  <!-- Metric Callout Cards on the Bottom -->
  <g transform="translate(60, 285)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="250" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Numeric Hallucination</text>
    <text x="20" y="66" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">0.00%</text>
    <text x="110" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Certified Zero Fabricated Rates</text>

    <!-- Card 2 -->
    <rect x="270" y="0" width="250" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="290" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Throughput Capacity</text>
    <text x="290" y="66" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">1,405 QPS</text>
    <text x="430" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">p95 &lt; 4ms latency</text>

    <!-- Card 3 -->
    <rect x="540" y="0" width="250" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="560" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Verified Citations</text>
    <text x="560" y="66" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">100.0%</text>
    <text x="670" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Official Gazette Proof</text>

    <!-- Card 4 -->
    <rect x="810" y="0" width="265" height="85" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="830" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Temporal Version Graph</text>
    <text x="830" y="66" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">DAG Chains</text>
    <text x="980" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Automatic Amendment Tracking</text>
  </g>
</svg>
