    <text x="24" y="115" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Numeric Hallucination Rate</text>
    <text x="24" y="133" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">NLI Entailment + Strict Numeric Guard</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(465, 355)">
