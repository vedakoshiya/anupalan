    <text x="24" y="115" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Local Burst Throughput Capacity</text>
    <text x="24" y="133" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">p95 Latency 3.4ms with Temporal Cache</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(850, 355)">
    <rect width="350" height="150" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.2"/>
    <circle cx="36" cy="36" r="14" fill="#581C87"/>
    <text x="30" y="42" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800">⛓</text>
    <text x="60" y="42" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Temporal Version DAG</text>
    <text x="24" y="90" fill="#C084FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900">100.0%</text>
    <text x="24" y="115" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Verified Gazette Citations</text>
    <text x="24" y="133" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Automatic Supersession Resolution</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(80, 545)">
    <line x1="0" y1="0" x2="1120" y2="0" stroke="#1E293B" stroke-width="1.2"/>
    <text x="0" y="40" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      SUPPORTED SCRIPTS: <tspan fill="#F8FAFC">English • ગુજરાતી (Gujarati) • हिन्दी (Hindi) • Gujlish &amp; Hinglish</tspan>
    </text>
    <text x="1120" y="40" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      APACHE 2.0 OPEN SOURCE • <tspan fill="#38BDF8">github.com/vedakoshiya/anupalan</tspan>
    </text>
  </g>
</svg>