<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="40%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#161f38"/>
    </linearGradient>

    <linearGradient id="tricolorAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="48%" stop-color="#FFFFFF"/>
      <stop offset="52%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <linearGradient id="cyanText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E1626" stop-opacity="0.95"/>
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#gridPattern)"/>

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="1150" cy="120" r="240" fill="#38BDF8" opacity="0.08"/>
  <circle cx="120" cy="520" r="260" fill="#818CF8" opacity="0.07"/>

  <!-- Top Tricolor Thin Border -->
  <rect x="0" y="0" width="1280" height="5" fill="url(#tricolorAccent)"/>

  <!-- Top Category Chip -->
  <g transform="translate(80, 55)">
    <rect width="360" height="34" rx="17" fill="#141E33" stroke="#334155" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="5" fill="#10B981"/>
    <text x="34" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">OPEN-SOURCE REGULATORY INTELLIGENCE</text>
  </g>

  <!-- Main Title & Script Badge -->
  <g transform="translate(80, 150)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      ANUPALAN
    </text>

    <!-- Transliteration Pill -->
    <rect x="365" y="-48" width="280" height="52" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <text x="382" y="-14" fill="url(#goldText)" font-family="-apple-system, BlinkMacSystemFont, 'Nirmala UI', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">
      અનુપાલન • अनुपालन
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 205)">
    <text x="0" y="0" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600">
      Zero-Hallucination Multilingual Compliance Navigator for Indian MSMEs
    </text>
    <text x="0" y="32" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Grounded Statutory RAG Engine with Legal DAG Supersession, NLI Verification &amp; DPDP 2023 Privacy
    </text>
  </g>

  <!-- Scope Badges Row -->
  <g transform="translate(80, 280)">
    <!-- Badge 1: GST -->
    <rect x="0" y="0" width="150" height="36" rx="8" fill="#141E33" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="16" y="23" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⚖️ GST &amp; CBIC</text>

    <!-- Badge 2: Companies Act -->
