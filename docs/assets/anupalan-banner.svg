    <text x="385" y="23" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⏱️ MSMED 45-Day Rule</text>

    <!-- Badge 4: Section 43B(h) -->
    <rect x="580" y="0" width="165" height="36" rx="8" fill="#141E33" stroke="#EC4899" stroke-width="1.2"/>
    <text x="595" y="23" fill="#F472B6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">💼 Section 43B(h)</text>

    <!-- Badge 5: Gujarat Industrial Policy -->
    <rect x="760" y="0" width="180" height="36" rx="8" fill="#141E33" stroke="#10B981" stroke-width="1.2"/>
    <text x="775" y="23" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🏭 Gujarat Industrial</text>

    <!-- Badge 6: DPDP 2023 -->
