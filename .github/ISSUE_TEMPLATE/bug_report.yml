name: "🐛 Bug Report / Citation Discrepancy"
description: "Report an incorrect citation, false rate extraction, unhandled query, or system error."
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Anupalan! Please provide as much detail as possible to help us reproduce and fix the issue.
  - type: dropdown
    id: category
    attributes:
      label: "Issue Category"
      description: "What part of Anupalan is affected?"
      options:
        - "Citation / Statutory Grounding Discrepancy"
        - "Indic / Vernacular Normalization Error (Gujarati, Hindi, Gujlish)"
        - "Numeric Guardrail False Positive or Abstention"
        - "API Endpoint / Web Client Error"
        - "Ingestion / Layout Parsing / Version Graph Issue"
        - "Performance / Latency Regression"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: query
    attributes:
      label: "Query Input"
      description: "Exact text of the compliance query tested (if applicable)."
      placeholder: "e.g. Job work par GST ketlo lage?"
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior / Correct Citation"
      description: "What should the system have answered or cited according to official gazettes?"
      placeholder: "e.g. Notification No. 20/2017-Central Tax (Rate), Entry 26(i), 5% rate for textile job work."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual System Response"
      description: "What did Anupalan output (claims, citations, or error message)?"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment"
      description: "OS, Python version, Docker vs bare metal, commit hash"
      placeholder: "e.g. Ubuntu 22.04, Python 3.11, Docker Compose, commit 84ed1ac"
