name: Anupalan CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-security:
    name: Lint, Type Check & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Secret Leak Prevention Check
        run: |
          # Basic check to guarantee no active secret keys or env files are committed
          if git ls-files | grep -E '^\.env$|\.env\.local$|\.pem$|\.key$|credentials\.json$'; then
            echo "CRITICAL: Private credential files detected in git tree!"
            exit 1
          fi
          echo "Secret check passed cleanly."
