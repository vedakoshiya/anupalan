name: Anupalan CI Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    name: Test Suite, CI Evaluation Gates & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] pydantic starlette httpx pytest pytest-cov

      - name: Secret Leak Prevention Check
        run: |
          if git ls-files | grep -E '^\.env$|\.env\.local$|\.pem$|\.key$|credentials\.json$'; then
            echo "CRITICAL: Private credential files detected in git tree!"
            exit 1
          fi
          echo "Secret check passed cleanly."

      - name: Run Full Test Suite with Coverage
        run: |
          python -m pytest tests --cov=. --cov-fail-under=90

      - name: Run CI Evaluation Benchmark Gates
        run: |
          python eval/eval_gate.py

      - name: Run Static Security & Injection Audit
        run: |
          python scripts/security_audit.py
