[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anupalan"
version = "0.1.0"
description = "Multilingual, Citation-Grounded Compliance Navigator for Indian MSMEs (RAG System)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Vedansi Koshiya", email = "vedakoshiya@users.noreply.github.com" },
]
keywords = [
    "compliance",
    "rag",
    "indian-msme",
    "gst",
    "gujarati",
    "hindi",
    "citation-grounded",
    "legal-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.5",
    "qdrant-client>=1.11.0",
    "sentence-transformers>=3.1.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "alembic>=1.13.3",
]
eval = [
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=packages --cov=services"
testpaths = ["tests"]
asyncio_mode = "auto"
